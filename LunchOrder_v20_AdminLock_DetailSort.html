 value="drink">飲料店</option></select></div><div><label for="newShopSort">排序</label><input id="newShopSort" required="" step="1" type="number" value="2"/></div><div style="align-self:end"><button type="submit">＋ 新增店家</button></div></form></div><div class="card"><h2>菜單管理</h2><div class="muted">先從上方店家清單選擇「管理菜單」，即可讀取、修改或新增該店餐點。</div><div class="hidden" id="menuArea"><div class="topgap"><b id="menuTitle"></b></div><div id="menuItems"></div><h2 class="topgap">新增餐點</h2><form class="grid" id="addItem"><div><label for="itemName">餐點名稱</label><input id="itemName" maxlength="100" required=""/></div><div><label for="itemPrice">售價（元）</label><input id="itemPrice" min="0" required="" step="1" type="number"/></div><div><label for="itemSort">排序</label><input id="itemSort" required="" step="1" type="number" value="2"/></div><div style="align-self:end"><button type="submit">＋ 新增餐點</button></div></form></div></div></main><div class="hidden" id="cloudOrdersAdmin"></div><p class="muted">僅授權管理者可以修改訂餐設定及店家菜單。</p></div></section><div class="footer">LunchOrder・團體訂餐系統</div></main><script>

async function v17LoadSettings(){
 if(!cloudAdminAuthorized){document.getElementById('v17SettingsBody').textContent='請先使用 Google 管理者登入。';return}
 try{
 const ss=await getDoc(doc(db,'sessions','current'));const s=ss.data()||{};

 const list=shops.filter(x=>x.active!==false);
 document.getElementById('v17SettingsBody').innerHTML=`<div class="field"><label>統一截止日期與時間</label><input id="v17Deadline" type="datetime-local" value="${fmt(deadline)}"></div><div class="field"><label>今日便當店</label><select id="v17Bento">${list.filter(x=>x.type==='bento').map(x=>`<option value="${esc(x.id)}" ${s.bentoId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label><input id="v17DrinkEnabled" type="checkbox" style="width:auto" ${s.drinkEnabled?'checked':''}> 今日提供飲料</label></div><div class="field"><label>今日飲料店</label><select id="v17Drink">${list.filter(x=>x.type==='drink').map(x=>`<option value="${esc(x.id)}" ${s.drinkId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>管理者訂購名稱（1 號袋）</label><input id="v17AdminLabel" value="${esc(s.adminLabel||'訂餐管理員')}"></div><label class="row"><input id="v17Open" type="checkbox" style="width:auto" ${s.orderingOpen?'checked':''}> 開放訂餐</label><div class="row" style="margin-top:12px"><button id="v17SaveSettings">儲存訂餐設定</button></div>`;
 document.getElementById('v17SaveSettings').onclick=async()=>{
  const date=document.getElementById('v17Deadline').value;
  if(!date)return alert('請先設定截止日期與時間');

  const isOpen=document.getElementById('v17Open').checked;
  if(isOpen&&ts.getTime()<=Date.now())return alert('開放訂餐時，截止時間必須晚於現在');

  if(drinkEnabled&&!document.getElementById('v17Drink').value)return alert('請先建立飲料店');
  try{await updateDoc(doc(db,'sessions','current'),{sharedDeadline:ts,orderingOpen:isOpen,finalized:false,bentoId:document.getElementById('v17Bento').value,drinkEnabled,drinkId:drinkEnabled?document.getElementById('v17Drink').value:'',adminLabel:document.getElementById('v17AdminLabel').value.trim()||'訂餐管理員'});alert('訂餐設定已儲存');await renderCloudAdminOrders();await v17LoadSettings()}catch(e){err(e)}
 };
 }catch(e){err(e)}

// v12: cloud ordering. Client checks improve UX; Firestore rules are authoritative.
const cuStatus=$('cloudUserStatus'),cuIdentity=$('cloudUserIdentity');
let cloudSession=null,cloudCatalog={},cloudCart={},cloudUnit='',cloudNote='',cloudReview=false,cloudOwn=[],cloudMenuOrder=new Map();
const su=['正常糖','少糖','半糖','微糖','無糖'],ic=['正常冰','少冰','微冰','去冰'];
const cloudKey=(shopId,itemId,sugar='',ice='')=>[shopId,itemId,sugar,ice].join('::');
const cloudOpen=()=>cloudSession?.orderingOpen===true&&cloudSession?.finalized!==true&&cloudSession?.sharedDeadline?.toDate?.()?.getTime()>Date.now();
function cuMessage(msg,bad=false){cuStatus.textContent=msg;cuStatus.className='notice'+(bad?' warn':'')}
function cuError(e){cuMessage('操作失敗：'+(e?.code||e?.message||String(e)),true)}
function cItem(k){return cloudCatalog[k]||null}
function cAmount(items){return Object.entries(items).reduce((a,[k,n])=>a+(cItem(k)?.price||0)*n,0)}
function cLabel(k){const x=cItem(k);if(x)return x.name+(x.sugar?'（'+x.sugar+'、'+x.ice+'）':'');const a=k.split('::');return a[1]||k}
function cloudCartRows(){return Object.entries(cloudCart).filter(([,v])=>v>0).map(([k,n])=>`<div class="dish"><div><b>${esc(cLabel(k))}</b><div class="muted">NT$ ${cItem(k)?.price||0} × ${n}</div></div><div class="qty"><button data-cart="${esc(k)}" data-delta="-1">−</button><strong>${n}</strong><button data-cart="${esc(k)}" data-delta="1">＋</button></div></div>`).join('')}
function cloudCartRender(){const count=Object.values(cloudCart).reduce((a,b)=>a+b,0);$('cloudOrderPanel').innerHTML=`<div class="card"><h2>${cloudReview?'我的訂購清單':'我的訂購清單'}</h2><div class="grid"><div class="field"><label>訂購單位／姓名</label><input id="cloudUnit" maxlength="80" value="${esc(cloudUnit)}" ${cloudReview?'disabled':''}></div><div class="field"><label>備註</label><input id="cloudNote" maxlength="300" value="${esc(cloudNote)}" ${cloudReview?'disabled':''}></div></div>${cloudCartRows()||'<div class="empty">尚未選擇餐點</div>'}<div class="row between"><b>合計 ${count} 件・NT$ ${cAmount(cloudCart)}</b><div class="row"><button id="cloudSubmit" ${!count||!cloudOpen()?'disabled':''}>確認送出訂單</button></div></div></div>`;

if($('cloudBack'))$('cloudBack').onclick=()=>{cloudReview=false;cloudCartRender()};

 const lookup=document.createElement('button');lookup.type='button';lookup.className='ghost';lookup.textContent='查詢本單位訂單';lookup.onclick=loadMyOrders;$('cloudOrderPanel').querySelector('.card').appendChild(lookup);
}

async function loadCloudUser(){
 const user=auth.currentUser;if(!user){cuMessage('請先按「匿名登入並讀取」。',true);return}
 cuIdentity.textContent=user.isAnonymous?'訂購者：'+user.uid:'管理者：'+(user.email||user.uid);
 try{
 cuMessage('正在讀取訂餐資料…');
 const snap=await getDoc(doc(db,'sessions','current'));if(!snap.exists())throw Error('找不到 /sessions/current');
 cloudSession=snap.data();cloudSession.id=cloudSession.roundId||'round_initial';
 const deadline=cloudSession.sharedDeadline?.toDate?.(),open=cloudOpen();
 $('cloudUserSession').innerHTML=`<div class="card"><div class="row between"><h2>當次訂餐設定</h2><span class="pill ${open?'':'off'}">${open?'開放訂餐':'尚未開放／已截止'}</span></div><p>統一截止時間：<b>${deadline?esc(deadline.toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})):'尚未設定'}</b></p></div>`;
 cloudCatalog={};cloudMenuOrder=new Map();let output='';
 for(const id of [cloudSession.bentoId,...(cloudSession.drinkEnabled&&cloudSession.drinkId?[cloudSession.drinkId]:[])].filter(Boolean)){
 const shopSnap=await getDoc(doc(db,'shops',id));if(!shopSnap.exists())continue;
 const shop=shopSnap.data();if(shop.active!==true)continue;
 const ms=await getDocs(collection(db,'shops',id,'menuItems'));
 const items=ms.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.active===true).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0));
 output+=`<div class="card"><h2>${shop.type==='drink'?'🧋':'🍱'} ${esc(shop.name)}</h2>`;
 for(const x of items){const k=cloudKey(id,x.id);cloudMenuOrder.set(k,cloudMenuOrder.size);cloudCatalog[k]={name:x.name,price:x.price,shopId:id,itemId:x.id,type:shop.type};
 output+=`<div class="dish"><div><b>${esc(x.name)}</b><div class="money">NT$ ${esc(x.price)}</div></div><div class="row">${shop.type==='drink'?`<select data-sugar="${esc(k)}">${su.map(v=>`<option>${v}</option>`).join('')}</select><select data-ice="${esc(k)}">${ic.map(v=>`<option>${v}</option>`).join('')}</select>`:''}<button data-add="${esc(k)}" ${open?'':'disabled'}>＋</button></div></div>`;
 }output+='</div>';

// v15: shared aggregation for unit totals, store totals, bags and settlement.
function aggregateCloudOrders(orders){
 const units=new Map(),stores=new Map();let bento=0,drinks=0,amount=0;
 for(const o of orders){
  for(const [key,raw] of Object.entries(o.remaining||{})){
   const n=Number(raw);if(!Number.isSafeInteger(n)||n<=0)continue;
   const d=o.details?.[key]||{};const type=d.type==='drink'?'drink':'bento';
   const unit=String(o.unit||'').trim();if(!unit)continue;
   if(!units.has(unit))units.set(unit,new Map());const m=units.get(unit);
   if(!m.has(key))m.set(key,{key,unit,n:0,detail:d});
   m.get(key).n+=n;
   if(!m.get(key).detail.name&&d.name)m.get(key).detail=d;
   const storeId=String(d.shopId||key.split('::')[0]||'');
   if(!stores.has(storeId))stores.set(storeId,new Map());const st=stores.get(storeId);
   if(!st.has(key))st.set(key,{key,n:0,detail:d});st.get(key).n+=n;
   if(type==='drink')drinks+=n;else bento+=n;
   amount+=n*Number(d.price||0);
  }
 }
 return {units,stores,bento,drinks,amount};
}
function cloudMealLabel(x){const d=x.detail||{};return String(d.name||x.key)+(d.sugar?'（'+d.sugar+'、'+(d.ice||'')+'）':'')}
function cloudBagFingerprint(units){return JSON.stringify([...units].map(([u,m])=>[u,[...m].map(([k,x])=>[k,x.n]).sort((a,b)=>a[0].localeCompare(b[0]))]).sort((a,b)=>a[0].localeCompare(b[0])))}
function makeCloudBagPlan(units,session,rid){
 const entries=[];let next=3;
 for(const [unit,m] of units){
  const meals=[...m.values()].filter(x=>x.detail.type!=='drink');
  const count=meals.reduce((a,x)=>a+x.n,0);
  if(!count)continue;
  const bag=unit===(session.adminLabel||'訂餐管理員')?1:count<=3?2:next++;
  for(const x of meals)entries.push({unit,key:x.key,bag,qty:x.n});
 }
 return {roundId:rid,fingerprint:cloudBagFingerprint(units),entries};
}
function cloudBagAllocation(plan,units){
 const bags=new Map();
 for(const e of plan.entries||[]){
  if(!Number.isInteger(e.bag)||e.bag<1||!Number.isInteger(e.qty)||e.qty<=0)continue;
  const item=units.get(e.unit)?.get(e.key);if(!item||item.detail.type==='drink')continue;
  if(!bags.has(e.bag))bags.set(e.bag,new Map());const unitMap=bags.get(e.bag);
  if(!unitMap.has(e.unit))unitMap.set(e.unit,[]);
  unitMap.get(e.unit).push({...item,n:e.qty});
 }
 // Drinks follow the lowest numbered bento bag of the same unit.
 // Drink-only units remain outside the bag plan.
 const firstBag=new Map();
 for(const [number,group] of [...bags].sort((a,b)=>a[0]-b[0])){
  for(const unit of group.keys())if(!firstBag.has(unit))firstBag.set(unit,number);
 }
 for(const [unit,items] of units){
  const number=firstBag.get(unit);if(number===undefined)continue;
  const bagItems=bags.get(number).get(unit);
  for(const item of items.values())if(item.detail.type==='drink'&&item.n>0)bagItems.push({...item});
 }
 return new Map([...bags].sort((a,b)=>a[0]-b[0]));
}

  const moveOptions=plan?.entries?.filter(e=>e.qty>0)||[];
  const moveHtml=moveOptions.length?`<div class="card" style="margin-top:12px"><h3>手動調整分袋</h3><p class="muted">可將單一便當品項的指定份數移至其他袋號，儲存後公告會使用調整結果。飲料跟隨同單位便當，不另分袋。</p><div class="grid"><div class="field"><label>要移動的便當</label><select id="cloudMoveSource">${moveOptions.map((e,i)=>`<option value="${i}">${esc(e.unit)}｜${esc(cloudMealLabel(units.get(e.unit).get(e.key)))} × ${e.qty}（第 ${e.bag} 袋）</option>`).join('')}</select></div><div class="field"><label>移動份數</label><input id="cloudMoveQty" type="number" min="1" value="1" step="1"></div><div class="field"><label>移至袋號</label><input id="cloudMoveTarget" type="number" min="1" value="3" step="1"></div></div><div class="row"><button id="cloudMoveSave">儲存分袋調整</button><button id="cloudResetBags" class="ghost">恢復自動分袋</button></div></div>`:'';
  $('cloudOrdersAdmin').innerHTML=`<div class="card"><h2>本輪訂單管理</h2><div class="notice">目前輪次：${esc(rid)}。訂餐期間僅顯示即時統計；截止後由管理者產生並確認分袋，分袋結果會儲存。</div><div class="grid three"><div class="kpi">訂購單位<b>${units.size}</b></div><div class="kpi">便當<b>${bento}</b></div><div class="kpi">飲料<b>${drinks}</b></div></div><p><b>合計 NT$ ${amount}</b></p><div class="row"><button id="cloudRefreshOrders" class="ghost">重新整理訂單</button><button id="cloudCloseOrders" ${isClosed?'disabled':''}>提前截止訂餐</button><button id="cloudStartRound" class="ghost">開始新一輪（舊單保留）</button><button id="cloudClearHistory" class="danger">清空歷史訂單（永久刪除）</button></div><h3 style="margin-top:20px">各單位訂單</h3>${unitHtml}<h3>店家訂購總表</h3>${storeHtml}<div class="card" style="margin-top:18px"><h3>截止後分袋</h3>${!isClosed?'<p class="muted">訂餐尚未截止，分袋功能將在截止後開放。</p>':`<p class="muted">${plan?'已產生分袋結果，可手動調整。':'尚未產生分袋結果，請按下方按鈕。'} 只有飲料的單位不分袋。</p><button id="cloudGenerateBags">${plan?'重新自動分袋（覆蓋手動調整）':'產生自動分袋'}</button>${plan?bagHtml+moveHtml:''}`}</div><div class="card" style="margin-top:18px"><h3>訂餐結算公告</h3><p class="muted">${!isClosed?'訂餐截止後才能產生公告。':!plan?'請先產生分袋結果，才能產生結算公告。':'依已儲存的最終分袋結果計算，只有飲料的單位不顯示袋號。'}</p><textarea id="cloudNoticeText" rows="8" readonly style="min-height:170px" placeholder="截止並分袋後產生結算公告"></textarea><div class="row"><button id="cloudGenerateNotice" ${isClosed&&plan?'':'disabled'}>產生結算訊息</button><button id="cloudCopyNotice" class="ghost" disabled>複製訊息</button></div></div><div class="card" style="margin-top:18px"><h3>各單位訂餐明細</h3><p class="muted">依本輪有效訂單彙整餐點與數量，含飲料甜度及冰量；與結算公告分開複製。</p><textarea id="cloudDetailText" rows="10" readonly style="min-height:210px" placeholder="產生各單位訂餐明細"></textarea><div class="row"><button id="cloudGenerateDetail" ${isClosed?'':'disabled'}>產生明細訊息</button><button id="cloudCopyDetail" class="ghost" disabled>複製明細</button></div></div><p class="muted">歷史訂單：${past.length} 筆；沒有本輪 roundId 的測試文件不會混入統計。</p></div>`;
  $('cloudRefreshOrders').onclick=renderCloudAdminOrders;
  $('cloudCloseOrders').onclick=async()=>{if(!confirm('確定提前截止本輪訂餐？截止後使用者不能追加或取消。'))return;try{await updateDoc(doc(db,'sessions','current'),{orderingOpen:false});await renderCloudAdminOrders()}catch(e){err(e)}};
  if(isClosed){
   $('cloudGenerateBags').onclick=async()=>{if(plan&&!confirm('確定重新自動分袋？目前手動調整的袋號將被覆蓋。'))return;try{await updateDoc(doc(db,'sessions','current'),{bagPlan:makeCloudBagPlan(units,session,rid)});await renderCloudAdminOrders()}catch(e){err(e)}};
   if(plan){
    if($('cloudMoveSave'))$('cloudMoveSave').onclick=async()=>{
     const source=moveOptions[Number($('cloudMoveSource').value)],qty=Number($('cloudMoveQty').value),target=Number($('cloudMoveTarget').value);
     if(!source||!Number.isSafeInteger(qty)||qty<1||qty>source.qty||!Number.isSafeInteger(target)||target<1||target>999||target===source.bag)return alert('請確認移動份數及目標袋號（須不同於原袋號）');
     const entries=plan.entries.map(e=>({...e}));const old=entries.find(e=>e.unit===source.unit&&e.key===source.key&&e.bag===source.bag);
     if(!old||old.qty<qty)return alert('目前袋內數量不足');old.qty-=qty;
     let dest=entries.find(e=>e.unit===source.unit&&e.key===source.key&&e.bag===target);
     if(dest)dest.qty+=qty;else entries.push({unit:source.unit,key:source.key,bag:target,qty});
     try{await updateDoc(doc(db,'sessions','current'),{bagPlan:{...plan,entries:entries.filter(e=>e.qty>0)}});await renderCloudAdminOrders()}catch(e){err(e)}
    };
    if($('cloudResetBags'))$('cloudResetBags').onclick=async()=>{if(!confirm('確定恢復自動分袋？'))return;try{await updateDoc(doc(db,'sessions','current'),{bagPlan:makeCloudBagPlan(units,session,rid)});await renderCloudAdminOrders()}catch(e){err(e)}};
   }
  }
  $('cloudGenerateDetail').onclick=()=>{$('cloudDetailText').value=detailText;$('cloudCopyDetail').disabled=false};
  $('cloudCopyDetail').onclick=async()=>{try{await navigator.clipboard.writeText($('cloudDetailText').value);alert('已複製訂餐明細')}catch(e){$('cloudDetailText').select();alert('無法自動複製，請手動複製選取文字')}};
  $('cloudGenerateNotice').onclick=()=>{$('cloudNoticeText').value=noticeText;$('cloudCopyNotice').disabled=false};
  $('cloudCopyNotice').onclick=async()=>{try{await navigator.clipboard.writeText($('cloudNoticeText').value);alert('已複製結算訊息')}catch(e){$('cloudNoticeText').select();alert('無法自動複製，請手動複製選取文字')}};
  $('cloudStartRound').onclick=async()=>{if(!confirm('確定結束目前輪次並開始新一輪？舊訂單會保留，新一輪預設關閉訂餐。'))return;try{await updateDoc(doc(db,'sessions','current'),{roundId:'round_'+Date.now().toString(36),orderingOpen:false,finalized:false,bagPlan:null});await renderCloudAdminOrders();alert('新一輪已建立。請設定新的截止時間並手動開放訂餐。')}catch(e){err(e)}};
  $('cloudClearHistory').onclick=async()=>{if(!past.length)return alert('沒有歷史訂單');if(prompt('要永久刪除 '+past.length+' 筆歷史訂單，請輸入「刪除歷史」')!=='刪除歷史')return;try{for(let i=0;i<past.length;i+=400){const batch=writeBatch(db);past.slice(i,i+400).forEach(x=>batch.delete(doc(db,'orders',x.id)));await batch.commit()}await renderCloudAdminOrders();alert('歷史訂單已刪除')}catch(e){err(e)}};
 }catch(e){err(e)}
}


setTimeout(()=>v17InitUser(),200);
</script></body></html>
