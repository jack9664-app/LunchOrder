<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LunchOrder｜管理者登入測試</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f8fb;color:#233043;margin:0;padding:28px 14px}.card{max-width:540px;margin:9vh auto;background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 40px #18315314}h1{font-size:24px}p{line-height:1.7;color:#536174}button{border:0;border-radius:10px;padding:13px 20px;font-weight:700;background:#2563eb;color:white;cursor:pointer;margin:5px 7px 5px 0}button.secondary{background:#e7edf5;color:#233043}button:disabled{opacity:.5;cursor:default}.result{background:#f1f5fa;padding:16px;border-radius:10px;word-break:break-all;margin:16px 0}.label{font-size:13px;color:#66768b}code{font-size:14px}#status{color:#465a75}</style></head><body><main class="card"><h1>LunchOrder｜管理者登入測試</h1><p>使用未來負責訂餐管理的 Google 帳號登入。這個測試頁面只驗證身分、顯示 Firebase UID，不會修改資料庫。</p><p id="status">正在初始化 Firebase…</p><button id="login" disabled>使用 Google 帳號登入</button><button id="logout" class="secondary" hidden>登出</button><section id="details" hidden><div class="result"><div class="label">Firebase UID（管理者權限設定需要）</div><p><code id="uid"></code></p><button id="copy" class="secondary">複製 UID</button></div><div class="label">目前登入的 Google 帳號</div><p id="email"></p></section><p class="label">請將此 HTML 上傳至 GitHub 儲存庫 LunchOrder 的根目錄，檔名保持 LunchOrder_admin_login_test.html，再透過 GitHub Pages 網址開啟。請勿直接以 file:// 開啟。</p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyD6lpG4KIlx7KrhOOkJDMQozi2GdESHgO4',authDomain:'lunchorder-4a540.firebaseapp.com',projectId:'lunchorder-4a540',storageBucket:'lunchorder-4a540.firebasestorage.app',messagingSenderId:'1047054056888',appId:'1:1047054056888:web:527b16610257274ff9234d',measurementId:'G-61D42Q84PT'};
const $=id=>document.getElementById(id);const auth=getAuth(initializeApp(firebaseConfig));const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
$('login').onclick=async()=>{try{$('status').textContent='正在開啟 Google 登入視窗…';await signInWithPopup(auth,provider)}catch(e){$('status').textContent='登入失敗：'+e.code+'。請確認 GitHub Pages 網域已授權，且瀏覽器沒有封鎖彈出視窗。'}};
$('logout').onclick=async()=>{try{await signOut(auth)}catch(e){$('status').textContent='登出失敗：'+e.code}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('uid').textContent);$('status').textContent='UID 已複製'}catch(e){$('status').textContent='無法自動複製，請手動選取 UID'}};
onAuthStateChanged(auth,u=>{$('login').disabled=false;$('login').hidden=!!u;$('logout').hidden=!u;$('details').hidden=!u;$('status').textContent=u?'登入成功，請複製下方 UID。':'尚未登入';if(u){$('uid').textContent=u.uid;$('email').textContent=u.email||'(未提供)'}},e=>{$('status').textContent='Firebase 初始化驗證失敗：'+e.code});
</script></body></html>
