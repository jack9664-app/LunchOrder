<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LunchOrder｜團體便當訂餐</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#253041;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f1;padding:17px max(16px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0}h2{font-size:20px;margin:0 0 15px}h3{margin:10px 0}.sub{color:#687587;font-size:13px}.wrap{max-width:960px;margin:24px auto;padding:0 16px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{background:white;border:1px solid #dce3ed;color:#39495d}.tab.active{background:#2659c8;color:white}.card{background:white;border:1px solid #e5e9f1;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #142b4d08}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650;font-size:14px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#2659c8;color:white}.danger{background:#b42332;color:white}.light{background:#edf2fa;color:#28425f}.success{background:#15734b;color:white}input,textarea{width:100%;padding:11px;border:1px solid #cfd8e6;border-radius:9px;font:inherit;background:#fff}textarea{resize:vertical}label{font-size:14px;font-weight:600;display:block;margin:12px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f5}.item:last-child{border-bottom:0}.photo{width:84px;height:84px;object-fit:cover;border-radius:12px;background:#f1f4f8}.itemmain{flex:1;min-width:0}.price{color:#bf541d;font-weight:700}.qty{display:flex;gap:9px;align-items:center}.qty button{width:34px;height:34px;padding:0;background:#eaf0fa;color:#2659c8;font-size:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:#eff5ff;color:#244e91;margin:12px 0}.muted{color:#718096}.hidden{display:none!important}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px;border-bottom:1px solid #e9edf3;text-align:left;font-size:14px}th{background:#f6f8fc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{padding:5px 9px;border-radius:20px;background:#eaf4ed;color:#16623d;font-size:12px}.small{font-size:12px}.menuimg{width:100%;max-height:280px;object-fit:contain;border-radius:12px;background:#f5f6f9;margin-top:10px}.line{border:0;border-top:1px solid #e9edf3;margin:16px 0}@media(max-width:620px){.grid{grid-template-columns:1fr}.item{align-items:flex-start}.photo{width:72px;height:72px}.qty{margin-top:10px}header{padding:14px 16px}.card{padding:16px}}
</style>
</head>
<body>
<header><div><h1>🍱 LunchOrder</h1><div class="sub">團體便當訂餐系統・本機測試版</div></div><span class="pill">DEMO</span></header>
<main class="wrap"><div class="tabs"><button class="tab active" id="userTab" onclick="switchTab('user')">使用者訂餐</button><button class="tab" id="adminTab" onclick="switchTab('admin')">管理者後台（測試）</button></div>
<section id="userPage"><div class="card"><div class="row"><h2 id="shopTitle">今日訂餐</h2><span id="status"></span></div><div id="deadlineLabel" class="sub"></div><div id="menuPreview"></div><div id="closedNotice" class="notice hidden">目前尚未開放訂餐，請稍後再來。</div></div><div id="orderPanel" class="card"><h2>填寫訂單</h2><label for="buyer">訂購單位／姓名 *</label><input id="buyer" maxlength="60" placeholder="例如：航電組、王小明"><div id="products"></div><label for="memo">備註（選填）</label><textarea id="memo" rows="2" maxlength="300" placeholder="例如：飯少、不要辣"></textarea><hr class="line"><div class="row"><strong id="total">共 0 份｜NT$ 0</strong><button class="primary" onclick="submitOrder()">送出訂單</button></div></div></section>
<section id="adminPage" class="hidden"><div class="notice">⚠️ 測試模式：任何開啟此網頁的人都能進入管理者頁面。正式上線前必須接上登入與後端權限驗證。</div><div class="card"><h2>開團設定</h2><div class="grid"><div><label for="shop">店家名稱</label><input id="shop" placeholder="例如：幸福便當"></div><div><label for="deadline">截止時間</label><input id="deadline" type="datetime-local"></div></div><label for="menuFile">整張菜單照片（選填）</label><input id="menuFile" type="file" accept="image/*"><div id="adminMenuPreview"></div><div class="actions"><button class="primary" onclick="saveSettings()">儲存店家設定</button><button class="success" onclick="setOpen(true)">開放訂餐</button><button class="light" onclick="setOpen(false)">截止訂餐</button></div></div><div class="card"><div class="row"><h2>餐點管理</h2><span class="sub">可上傳個別餐點照片</span></div><div class="grid"><div><label for="foodName">餐點名稱</label><input id="foodName" placeholder="例如：雞腿飯"></div><div><label for="foodPrice">價格（NT$）</label><input id="foodPrice" type="number" min="0" step="1" placeholder="120"></div></div><label for="foodPhoto">餐點照片（選填）</label><input id="foodPhoto" type="file" accept="image/*"><div class="actions"><button class="primary" onclick="addFood()">＋ 新增餐點</button></div><div id="adminFoods"></div></div><div class="card"><div class="row"><h2>訂單統計</h2><span id="adminCount" class="pill"></span></div><div id="summary"></div><h3>訂購明細</h3><div id="orderTable"></div><div class="actions"><button class="primary" onclick="exportCSV()">匯出 CSV（Excel 可開啟）</button><button class="light" onclick="copySummary()">複製店家訂單</button><button class="danger" onclick="clearOrders()">清除本次訂單</button></div></div></section>
<div class="sub" style="text-align:center;margin:30px 0">本版本使用瀏覽器 localStorage 儲存測試資料；不同裝置不會同步。</div></main>
<script>
const KEY='lunchorder_demo_v1';
const seed={shop:'幸福便當（範例）',deadline:'',open:true,menuImage:'',foods:[{id:'a',name:'香酥雞腿飯',price:120,image:''},{id:'b',name:'招牌排骨飯',price:110,image:''},{id:'c',name:'素食便當',price:100,image:''}],orders:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{data=structuredClone(seed)}
let quantities={};const $=id=>document.getElementById(id);const money=n=>'NT$ '+Number(n).toLocaleString('zh-TW');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('儲存失敗：照片可能太大。請改用較小的照片。');return false}}
function isOpen(){return data.open&&(!data.deadline||new Date(data.deadline).getTime()>Date.now())}
function switchTab(t){$('userPage').classList.toggle('hidden',t!=='user');$('adminPage').classList.toggle('hidden',t!=='admin');$('userTab').classList.toggle('active',t==='user');$('adminTab').classList.toggle('active',t==='admin');render()}
function render(){const open=isOpen();$('shopTitle').textContent=data.shop||'今日訂餐';$('status').textContent=open?'🟢 開放訂餐':'🔒 未開放／已截止';$('deadlineLabel').textContent=data.deadline?'截止：'+new Date(data.deadline).toLocaleString('zh-TW',{hour12:false}):'未設定截止時間';$('closedNotice').classList.toggle('hidden',open);$('orderPanel').classList.toggle('hidden',!open);$('menuPreview').innerHTML=data.menuImage?'<img class="menuimg" alt="店家菜單" src="'+data.menuImage+'">':'';$('products').innerHTML=data.foods.map(f=>'<div class="item">'+(f.image?'<img class="photo" src="'+f.image+'" alt="'+safe(f.name)+'">':'<div class="photo" style="display:grid;place-items:center;font-size:32px">🍱</div>')+'<div class="itemmain"><strong>'+safe(f.name)+'</strong><div class="price">'+money(f.price)+'</div><div class="qty"><button aria-label="減少" onclick="changeQty(\''+f.id+'\',-1)">−</button><strong>'+Number(quantities[f.id]||0)+'</strong><button aria-label="增加" onclick="changeQty(\''+f.id+'\',1)">＋</button></div></div></div>').join('')||'<p class="muted">管理者尚未新增餐點。</p>';$('shop').value=data.shop;$('deadline').value=data.deadline;$('adminMenuPreview').innerHTML=data.menuImage?'<img class="menuimg" alt="菜單照片" src="'+data.menuImage+'"><div class="actions"><button class="light" onclick="removeMenuImage()">移除菜單照片</button></div>':'';$('adminFoods').innerHTML=data.foods.map(f=>'<div class="item">'+(f.image?'<img class="photo" src="'+f.image+'">':'<div class="photo" style="display:grid;place-items:center">🍱</div>')+'<div class="itemmain"><strong>'+safe(f.name)+'</strong><div>'+money(f.price)+'</div></div><button class="danger" onclick="removeFood(\''+f.id+'\')">刪除</button></div>').join('');renderTotals();renderOrders()}
function changeQty(id,n){quantities[id]=Math.max(0,Math.min(999,Number(quantities[id]||0)+n));render()}
function renderTotals(){let count=0,total=0;data.foods.forEach(f=>{count+=Number(quantities[f.id]||0);total+=Number(quantities[f.id]||0)*f.price});$('total').textContent='共 '+count+' 份｜'+money(total)}
function submitOrder(){if(!isOpen())return alert('訂餐已截止');const buyer=$('buyer').value.trim();if(!buyer)return alert('請輸入訂購單位／姓名');const items=data.foods.filter(f=>Number(quantities[f.id]||0)>0).map(f=>({id:f.id,name:f.name,price:f.price,qty:Number(quantities[f.id])}));if(!items.length)return alert('請至少選擇一份餐點');const count=items.reduce((s,x)=>s+x.qty,0),total=items.reduce((s,x)=>s+x.qty*x.price,0);data.orders.push({id:crypto.randomUUID(),buyer,memo:$('memo').value.trim(),items,created:new Date().toISOString()});if(!persist())return;quantities={};$('buyer').value='';$('memo').value='';render();alert('訂購成功！\n'+buyer+'\n共 '+count+' 份｜'+money(total)+'\n\n注意：此為單機測試資料，其他裝置看不到。')}
function saveSettings(){data.shop=$('shop').value.trim();data.deadline=$('deadline').value;persist();render();alert('店家設定已儲存')}
function setOpen(v){data.shop=$('shop').value.trim();data.deadline=$('deadline').value;if(v&&!data.shop)return alert('請先輸入店家名稱');if(v&&data.deadline&&new Date(data.deadline).getTime()<=Date.now())return alert('截止時間必須晚於現在');data.open=v;persist();render();alert(v?'已開放訂餐（僅限這台裝置的測試資料）':'已截止訂餐')}
function resizeImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject(new Error('請選擇圖片'));const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,900/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('圖片讀取失敗'))};img.src=url})}
$('menuFile').addEventListener('change',async e=>{try{const pic=await resizeImage(e.target.files[0]);if(pic){data.menuImage=pic;persist();render()}}catch(err){alert(err.message)}e.target.value='' });
function removeMenuImage(){data.menuImage='';persist();render()}
async function addFood(){const name=$('foodName').value.trim(),price=Number($('foodPrice').value);if(!name||$('foodPrice').value===''||!Number.isInteger(price)||price<0)return alert('請輸入餐點名稱及正確價格');try{const image=await resizeImage($('foodPhoto').files[0]);data.foods.push({id:crypto.randomUUID(),name,price,image});if(!persist())return;$('foodName').value='';$('foodPrice').value='';$('foodPhoto').value='';render()}catch(e){alert(e.message)}}
function removeFood(id){if(!confirm('確定刪除此餐點？已送出的訂單明細仍會保留。'))return;data.foods=data.foods.filter(f=>f.id!==id);persist();render()}
function allRows(){return data.orders.flatMap(o=>o.items.map(i=>({buyer:o.buyer,name:i.name,qty:i.qty,price:i.price,subtotal:i.qty*i.price,memo:o.memo,time:o.created})))}
function totals(){const m=new Map();allRows().forEach(r=>{const k=r.name+'\u0000'+r.price;if(!m.has(k))m.set(k,{name:r.name,price:r.price,qty:0});m.get(k).qty+=r.qty});return [...m.values()]}
function renderOrders(){const rows=allRows(),ts=totals(),count=rows.reduce((s,r)=>s+r.qty,0),amount=rows.reduce((s,r)=>s+r.subtotal,0);$('adminCount').textContent=data.orders.length+' 筆｜'+count+' 份｜'+money(amount);$('summary').innerHTML=ts.length?'<div class="tablewrap"><table><thead><tr><th>品項</th><th>份數</th><th>金額</th></tr></thead><tbody>'+ts.map(x=>'<tr><td>'+safe(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.qty*x.price)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">目前尚無訂單</p>';$('orderTable').innerHTML=rows.length?'<div class="tablewrap"><table><thead><tr><th>單位／姓名</th><th>餐點</th><th>數量</th><th>單價</th><th>小計</th><th>備註</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+safe(r.buyer)+'</td><td>'+safe(r.name)+'</td><td>'+r.qty+'</td><td>'+money(r.price)+'</td><td>'+money(r.subtotal)+'</td><td>'+safe(r.memo)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">尚無訂購明細</p>'}
function exportCSV(){const rows=allRows();if(!rows.length)return alert('目前沒有訂單');const csv=[['訂購單位／姓名','餐點','數量','單價','小計','備註','訂購時間'],...rows.map(r=>[r.buyer,r.name,r.qty,r.price,r.subtotal,r.memo,r.time])].map(row=>row.map(v=>'"'+String(v).replace(/^[=+\-@\t\r]/,'\'$&').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LunchOrder_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copySummary(){const t=totals();if(!t.length)return alert('目前沒有訂單');const count=t.reduce((s,x)=>s+x.qty,0),sum=t.reduce((s,x)=>s+x.qty*x.price,0),str=[data.shop,...t.map(x=>x.name+' × '+x.qty),'共 '+count+' 份','總金額 '+money(sum)].join('\n');try{await navigator.clipboard.writeText(str);alert('已複製店家訂單')}catch{prompt('請複製以下文字',str)}}
function clearOrders(){if(!data.orders.length)return alert('目前沒有訂單');if(!confirm('確定清除所有 '+data.orders.length+' 筆訂單？此操作無法復原，請先匯出 CSV。'))return;data.orders=[];persist();render()}
render();setInterval(()=>{if(!$('userPage').classList.contains('hidden')){const old=$('status').textContent,now=isOpen()?'🟢 開放訂餐':'🔒 未開放／已截止';if(old!==now)render()}},15000);
</script>
</body></html>
