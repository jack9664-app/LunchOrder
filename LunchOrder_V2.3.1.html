function backupPlainObject(v){return v!==null&&typeof v==='object'&&!Array.isArray(v)}

 if(depth>40)return false;
 if(v===null||typeof v==='string'||typeof v==='boolean')return true;
 if(typeof v==='number')return Number.isFinite(v);
 if(Array.isArray(v))return v.every(x=>backupValidValue(x,depth+1));
 if(!backupPlainObject(v))return false;

  if(!backupPlainObject(entry)||typeof entry.path!=='string'||!backupPlainObject(entry.data))throw Error('備份包含無效的文件資料');

 const {types,selected}=updateOtherRestoreSummary();if(!selected.length)return;
 const sensitive=types.some(x=>x[1]==='orders'||x[1]==='sessions');
 const equal=(a,b)=>JSON.stringify(backupCanonical(a))===JSON.stringify(backupCanonical(b));
 const btn=$('backupOtherRestore'),message=$('backupOtherStatus');backupRestoreBusy=true;btn.disabled=true;
 let completed=0;
 try{
  // Active order rounds must not be overwritten; check again before each write.
  const checkClosed=async()=>{
   if(!sensitive)return;
   const snap=await getDoc(doc(db,'sessions','current')),state=snap.data();
   if(!state||state.orderingOpen!==false||state.sharedDeadline?.toDate?.()?.getTime()>Date.now())throw Error('目前訂餐尚未確定關閉且截止，禁止還原訂單或訂餐設定');
  };
  await checkClosed();
  const safety=[];
  for(const c of selected){
   if(!isBackupAdmin()||!cloudAdminAuthorized)throw Error('管理者身分已變更');
   const snap=await getDoc(doc(db,...c.entry.path.split('/'))),live=snap.exists()?backupEncode(snap.data()):null;
   if(snap.exists()===c.wasMissing||(!c.wasMissing&&!equal(live,c.expected)))throw Error('比對後資料已變更：'+c.entry.path+'，請重新比對');
   safety.push({path:c.entry.path,existed:snap.exists(),data:live});
  }
  await checkClosed();
  backupDownloadLocal({format:'LunchOrder-Selected-Categories-Safety-Copy',version:1,projectId:config.projectId,createdAt:new Date().toISOString(),documents:safety},'LunchOrder_BeforeSelectedRestore');
  message.textContent='已產生 '+safety.length+' 份文件的現況安全備份；請確認下載成功並妥善保存。';
  if(!confirm('請確認已保存還原前安全備份。\n\n即將還原：'+types.map(x=>x[2]).join('、')+'\n補回 '+selected.filter(c=>c.wasMissing).length+' 份、覆蓋 '+selected.filter(c=>!c.wasMissing).length+' 份。\n不刪除任何文件。\n\n管理者權限、訂餐設定與訂單可能受到影響，請確保不在訂餐期間。'))return;
  if(prompt('高風險操作最後確認：輸入「確認選擇性還原」才能寫入。')!=='確認選擇性還原')return;
  for(const c of selected){
   if(!isBackupAdmin()||!cloudAdminAuthorized)throw Error('管理者身分已變更，停止後續寫入');
   await checkClosed();
   const ref=doc(db,...c.entry.path.split('/'));
   await runTransaction(db,async tx=>{
    const snap=await tx.get(ref),live=snap.exists()?backupEncode(snap.data()):null;
    if(snap.exists()===c.wasMissing||(!c.wasMissing&&!equal(live,c.expected)))throw Error('文件已變更：'+c.entry.path+'，停止還原');
    tx.set(ref,backupDecode(c.entry.data));
   });
   const verify=await getDoc(ref);
   if(!verify.exists()||!equal(backupEncode(verify.data()),c.entry.data))throw Error('寫入後驗證失敗：'+c.entry.path);
   completed++;message.textContent='已還原並驗證 '+completed+' / '+selected.length+' 份文件…';
  }
  message.textContent='選擇性還原完成：'+completed+' 份文件驗證相同。請重新執行唯讀比對。';
  backupOtherCandidates=[];backupMirrorPlan=null;$('backupMirrorPanel').classList.add('hide');$('backupMirrorAcknowledge').checked=false;$('backupOtherPanel').classList.add('hide');
  alert('選擇性還原完成，共 '+completed+' 份。');
 }catch(e){message.textContent='還原停止：已完成 '+completed+' / '+selected.length+' 份。原因：'+(e.code||e.message||String(e))+'。可能部分成功，請重新比對並保存安全備份。';alert(message.textContent)}
 finally{backupRestoreBusy=false;btn.disabled=false;updateOtherRestoreSummary()}
};

// V2.3: disaster-only mirror of the known Firestore document paths.
$('backupMirrorAcknowledge').onchange=()=>{$('backupMirrorRestore').disabled=!$('backupMirrorAcknowledge').checked||!backupMirrorPlan||backupRestoreBusy||backupPreviewBusy};
async function backupMirrorCollect(){
 const map=new Map();
 const collect=async parts=>{const snap=await getDocs(collection(db,...parts));for(const d of snap.docs)map.set([...parts,d.id].join('/'),backupEncode(d.data()));return snap.docs};
 await collect(['admins']);await collect(['sessions']);await collect(['orders']);
 const shopsNow=await collect(['shops']);
 const ids=new Set([...shopsNow.docs.map(d=>d.id),...(backupPreview?.documents||[]).filter(x=>x.path.startsWith('shops/')).map(x=>x.path.split('/')[1])]);
 for(const id of ids)await collect(['shops',id,'menuItems']);
 return map;
}
const backupMirrorEqual=(a,b)=>JSON.stringify(backupCanonical(a))===JSON.stringify(backupCanonical(b));
$('backupMirrorRestore').onclick=async()=>{
 if(!isBackupAdmin()||!cloudAdminAuthorized||!backupPreview||!backupMirrorPlan||backupMirrorPlan.backupId!==backupPreview||backupRestoreBusy||backupPreviewBusy||!$('backupMirrorAcknowledge').checked)return;
 const plan=backupMirrorPlan,btn=$('backupMirrorRestore'),message=$('backupMirrorStatus');backupRestoreBusy=true;btn.disabled=true;
 let completed=0,total=0;
 try{
  if(!isBackupAdmin()||!cloudAdminAuthorized)throw Error('系統管理者身分已變更');
  message.textContent='正在重新讀取完整資料庫，檢查是否與差異預覽一致…';
  const current=await backupMirrorCollect();
  if(current.size!==plan.current.size||[...current].some(([path,data])=>!plan.current.has(path)||!backupMirrorEqual(data,plan.current.get(path))))throw Error('資料庫已在比對後變動，請重新執行唯讀比對');
  // The current round must be closed and its deadline passed. A missing session is allowed for disaster recovery.
  const session=await getDoc(doc(db,'sessions','current'));
  const state=session.data();
  if(state&&(state.orderingOpen!==false||state.sharedDeadline?.toDate?.()?.getTime()>Date.now()))throw Error('目前訂餐未確定關閉且截止，禁止鏡像還原');
  const target=new Map(backupPreview.documents.map(x=>[x.path,x.data]));
  const toDelete=[...current.keys()].filter(path=>!target.has(path));
  const toWrite=backupPreview.documents.filter(x=>!current.has(x.path)||!backupMirrorEqual(current.get(x.path),x.data));
  // Never delete the currently signed-in system administrator's authorization document.
  if(toDelete.includes('admins/'+ROOT_UID))throw Error('備份中缺少系統管理者文件，為避免鎖死管理權限，禁止刪除該文件');
  const restoredSession=target.get('sessions/current');
  if(restoredSession&&(restoredSession.orderingOpen===true||restoredSession.sharedDeadline?.__firestoreType==='timestamp'&&restoredSession.sharedDeadline.seconds*1000>Date.now()))throw Error('備份中的訂餐設定可能重新開放訂餐，請改用安全的關閉時段備份');
  // Download a FULL current-state safety backup, including documents slated for deletion.
  backupDownloadLocal({format:'LunchOrder-Firestore-Backup',version:1,projectId:config.projectId,createdAt:new Date().toISOString(),documentCount:current.size,documents:[...current].map(([path,data])=>({path,data}))},'LunchOrder_BeforeDisasterRestore');
  message.textContent='已產生整庫現況安全備份（'+current.size+' 份），請確認已下載並另存至安全位置。';
  if(!confirm('最高風險操作：請先確認已成功下載並保存整庫現況安全備份。\n\n補回／覆蓋 '+toWrite.length+' 份，刪除 '+toDelete.length+' 份。\n刪除包含備份後新增的訂單，且不能自動撤銷。\n已停止所有訂餐與其他管理操作？'))return;
  if(prompt('最後確認：請輸入「完整鏡像還原並刪除多餘資料」')!=='完整鏡像還原並刪除多餘資料')return;
  // Write parents before children, and the session last so a missing session is not recreated early.
  const writes=toWrite.sort((a,b)=>{
   const rank=p=>p==='sessions/current'?3:p.split('/').length===4?2:1;
   return rank(a.path)-rank(b.path);
  });
  // Delete menu items before shop parents; the active root admin document is never deleted.
  const deletes=toDelete.sort((a,b)=>b.split('/').length-a.split('/').length);
  total=writes.length+deletes.length;
  for(const entry of writes){
   if(!isBackupAdmin()||!cloudAdminAuthorized)throw Error('管理者身分已變更');
   const path=entry.path,ref=doc(db,...path.split('/')),expected=current.has(path)?current.get(path):null;
   // Stop if the current session was reopened during the restore.
   if(path!=='sessions/current'){
    const ss=await getDoc(doc(db,'sessions','current'));const st=ss.data();
    if(st&&(st.orderingOpen!==false||st.sharedDeadline?.toDate?.()?.getTime()>Date.now()))throw Error('訂餐在還原過程中重新開放，停止操作');
   }
   await runTransaction(db,async tx=>{
    const snap=await tx.get(ref),live=snap.exists()?backupEncode(snap.data()):null;
    if(!backupMirrorEqual(live,expected))throw Error('文件被其他操作修改：'+path);
    tx.set(ref,backupDecode(entry.data));
   });
   const verified=await getDoc(ref);
   if(!verified.exists()||!backupMirrorEqual(backupEncode(verified.data()),entry.data))throw Error('還原後驗證失敗：'+path);
   completed++;message.textContent='鏡像還原進行中：'+completed+' / '+total;
  }
  for(const path of deletes){
   if(!isBackupAdmin()||!cloudAdminAuthorized)throw Error('管理者身分已變更');
   const ss=await getDoc(doc(db,'sessions','current')),st=ss.data();
   if(st&&(st.orderingOpen!==false||st.sharedDeadline?.toDate?.()?.getTime()>Date.now()))throw Error('訂餐在還原過程中重新開放，停止刪除');
   const ref=doc(db,...path.split('/')),expected=current.get(path);
   await runTransaction(db,async tx=>{
    const snap=await tx.get(ref),live=snap.exists()?backupEncode(snap.data()):null;
    if(!backupMirrorEqual(live,expected))throw Error('待刪除文件已變更：'+path);
    tx.delete(ref);
   });
   const verified=await getDoc(ref);if(verified.exists())throw Error('刪除後驗證失敗：'+path);
   completed++;message.textContent='鏡像還原進行中：'+completed+' / '+total;
  }
  const finalState=await backupMirrorCollect();
  if(finalState.size!==target.size||[...target].some(([path,data])=>!finalState.has(path)||!backupMirrorEqual(finalState.get(path),data)))throw Error('已完成寫入，但整庫比對仍有差異，請重新檢查');
  message.textContent='完整鏡像還原成功：補回／覆蓋 '+writes.length+'、刪除 '+deletes.length+'；最終 '+target.size+' 份文件與備份一致。';
  backupMirrorPlan=null;$('backupMirrorPanel').classList.add('hide');alert('完整鏡像還原及最終比對成功。');
 }catch(e){message.textContent='災難復原中止：已完成 '+completed+' / '+total+' 項操作。'+(e.code||e.message||String(e))+'。可能部分成功，請保存安全備份並重新比對。';alert(message.textContent)}
 finally{backupRestoreBusy=false;btn.disabled=!backupMirrorPlan||!$('backupMirrorAcknowledge').checked}
};

// v15: shared aggregation for unit totals, store totals, bags and settlement.
function aggregateCloudOrders(orders){
 const units=new Map(),stores=new Map();let bento=0,drinks=0,amount=0;
 for(const o of orders){
  for(const [key,raw] of Object.entries(o.remaining||{})){
   const n=Number(raw);if(!Number.isSafeInteger(n)||n<=0)continue;
   const d=o.details?.[key]||{};const type=d.type==='drink'?'drink':'bento';
   const unit=String(o.unit||'').trim();if(!unit)continue;
   if(!units.has(unit))units.set(unit,new Map());const m=units.get(unit);
   // Keep order-time snapshots distinct when a menu item's price or name changes.
   // The original item key remains intact for bagging and menu ordering.
   const snapshotKey=JSON.stringify([key,d.name||'',Number(d.price||0),d.size||'',d.sugar||'',d.ice||'',d.toppings||[]]);
   if(!m.has(snapshotKey))m.set(snapshotKey,{key,unit,n:0,detail:d});
   m.get(snapshotKey).n+=n;
   const storeId=String(d.shopId||key.split('::')[0]||'');
   if(!stores.has(storeId))stores.set(storeId,new Map());const st=stores.get(storeId);
   if(!st.has(snapshotKey))st.set(snapshotKey,{key,n:0,detail:d});st.get(snapshotKey).n+=n;
   if(type==='drink')drinks+=n;else bento+=n;
   amount+=n*Number(d.price||0);
  }
 }
 return {units,stores,bento,drinks,amount};
}
function cloudMealLabel(x){const d=x.detail||{};return String(d.name||x.key)+(d.sugar?'（'+[d.size,d.sugar,d.ice,...(d.toppings||[]).map(t=>t.name)].filter(Boolean).join('、')+'）':'')}
function cloudBagFingerprint(units){return JSON.stringify([...units].map(([u,m])=>[u,[...m].map(([k,x])=>[k,x.n]).sort((a,b)=>a[0].localeCompare(b[0]))]).sort((a,b)=>a[0].localeCompare(b[0])))}
function makeCloudBagPlan(units,session,rid){
 const entries=[];let next=3;
 for(const [unit,m] of units){
  const meals=[...m.values()].filter(x=>x.detail.type!=='drink');
  const count=meals.reduce((a,x)=>a+x.n,0);
  if(!count)continue;
  const bag=unit===(session.adminLabel||'訂餐管理員')?1:count<=3?2:next++;
  for(const x of meals)entries.push({unit,key:x.key,bag,qty:x.n});
 }
 return {roundId:rid,fingerprint:cloudBagFingerprint(units),entries};
}
function cloudBagAllocation(plan,units){
 const bags=new Map();
 for(const e of plan.entries||[]){
  if(!Number.isInteger(e.bag)||e.bag<1||!Number.isInteger(e.qty)||e.qty<=0)continue;
  const item=units.get(e.unit)?.get(e.key);if(!item||item.detail.type==='drink')continue;
  if(!bags.has(e.bag))bags.set(e.bag,new Map());const unitMap=bags.get(e.bag);
  if(!unitMap.has(e.unit))unitMap.set(e.unit,[]);
  unitMap.get(e.unit).push({...item,n:e.qty});
 }
 // Drinks follow the lowest numbered bento bag of the same unit.
 // Drink-only units remain outside the bag plan.
 const firstBag=new Map();
 for(const [number,group] of [...bags].sort((a,b)=>a[0]-b[0])){
  for(const unit of group.keys())if(!firstBag.has(unit))firstBag.set(unit,number);
 }
 for(const [unit,items] of units){
  const number=firstBag.get(unit);if(number===undefined)continue;
  const bagItems=bags.get(number).get(unit);
  for(const item of items.values())if(item.detail.type==='drink'&&item.n>0)bagItems.push({...item});
 }

}
// Historical rounds are retained for 72 hours after the round is ended.
// Only rounds with an explicit endedAt marker are eligible for automatic deletion.
const HISTORY_MS=3*24*60*60*1000;
let historyCleanupRunning=false;
const historyDate=ms=>new Date(ms).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
async function cleanupExpiredRounds(session,orders){
 if(historyCleanupRunning)return false;
 const records=Array.isArray(session.roundHistory)?session.roundHistory:[];
 const expired=records.filter(r=>r?.id&&Number.isFinite(Number(r.endedAt))&&Number(r.endedAt)+HISTORY_MS<=Date.now()&&r.id!==(session.roundId||'round_initial'));
 if(!expired.length)return false;
 historyCleanupRunning=true;
 try{
  const ids=new Set(expired.map(r=>r.id));
  const doomed=orders.filter(o=>ids.has(o.roundId));
  for(let i=0;i<doomed.length;i+=400){const batch=writeBatch(db);doomed.slice(i,i+400).forEach(o=>batch.delete(doc(db,'orders',o.id)));await batch.commit()}
  // Verify only the expired rounds rather than reading every order a second time.
  // Keep expiry markers if any check fails so the next admin visit can retry safely.
  for(const roundId of ids){
   const remaining=await getDocs(query(collection(db,'orders'),where('roundId','==',roundId)));
   if(!remaining.empty)throw Error('歷史清理尚有未刪除訂單，保留清理紀錄供下次重試');
  }
  const latest=await getDoc(doc(db,'sessions','current'));
  const current=latest.data()||{};
  const latestRecords=Array.isArray(current.roundHistory)?current.roundHistory:[];
  await updateDoc(doc(db,'sessions','current'),{roundHistory:latestRecords.filter(r=>!ids.has(r.id))});
  return true;
 }finally{historyCleanupRunning=false}
}
function historyPanel(past,session){

  return `<details class="history-round" ${i===0?'open':''}><summary>${esc(dateText)}｜${g.orders.length} 筆｜NT$ ${agg.amount}</summary><div class="muted small">輪次：${esc(g.id)}</div><p><b>單位 ${agg.units.size}｜便當 ${agg.bento} 份｜飲料 ${agg.drinks} 杯｜合計 NT$ ${agg.amount}</b></p><h4>各單位明細</h4>${lines}<h4>店家統計</h4>${storeLines}</details>`;

  }

   const items=[...m.values()],sum=items.reduce((a,x)=>a+x.n*Number(x.detail.price||0),0);
   const bags=[...(unitBags.get(unit)||[])].sort((a,b)=>a-b);
   return unit+'：'+(bags.length?'第'+bags.join('、')+'袋，':'')+'共'+sum+'元'+(bags.length?'':'（僅飲料）');
  });
  const noticeText='【訂餐結算通知】\n'+noticeLines.join('\n')+'\n\n請各單位依公告領取餐點，謝謝。';
  const detailText='【各單位訂餐明細】\n\n'+[...units].map(([unit,m])=>{
   const lines=[...m.values()].filter(x=>x.n>0).sort((a,b)=>{const ad=a.detail||{},bd=b.detail||{};const at=ad.type==='drink'?1:0,bt=bd.type==='drink'?1:0;if(at!==bt)return at-bt;const as=Number(ad.sortOrder),bs=Number(bd.sortOrder);if(Number.isFinite(as)&&Number.isFinite(bs)&&as!==bs)return as-bs;return cloudMealLabel(a).localeCompare(cloudMealLabel(b),'zh-Hant')}).map(x=>cloudMealLabel(x)+' × '+x.n);
   return unit+'\n'+lines.join('\n');
  }).join('\n\n');
  const unitHtml=[...units].map(([unit,m])=>{
   const items=[...m.values()],sum=items.reduce((a,x)=>a+x.n*Number(x.detail.price||0),0);
   const bCount=items.filter(x=>x.detail.type!=='drink').reduce((a,x)=>a+x.n,0);
   return `<details><summary>${esc(unit)}｜便當 ${bCount} 份／飲料 ${items.reduce((a,x)=>a+x.n,0)-bCount} 杯｜NT$ ${sum}</summary>${items.map(x=>`<div class="dish"><span>${esc(cloudMealLabel(x))}（NT$ ${Number(x.detail.price||0)}）</span><b>× ${x.n}</b></div>`).join('')}</details>`;
  }).join('')||'<p class="muted">本輪沒有訂單</p>';
  const storeHtml=[...stores].map(([sid,m])=>`<div class="card" style="margin:10px 0"><h4>${esc(shopNames.get(sid)||sid)}</h4>${[...m.values()].map(x=>`<div class="dish"><span>${esc(cloudMealLabel(x))}</span><b>${x.n} ${x.detail.type==='drink'?'杯':'份'}</b></div>`).join('')}</div>`).join('')||'<p class="muted">沒有資料</p>';
  const bagHtml=[...bagMap].map(([bag,group])=>`<div class="bag"><div class="bagtitle">${bag} 號袋</div>${[...group].map(([unit,items])=>`<div class="bagline"><b>${esc(unit)}</b><span>${items.map(x=>esc(cloudMealLabel(x))+' × '+x.n).join('、')}</span></div>`).join('')}</div>`).join('')||'<p class="muted">沒有需要分袋的便當</p>';
  const moveOptions=plan?.entries?.filter(e=>e.qty>0)||[];
  const moveHtml=moveOptions.length?`<div class="card" style="margin-top:12px"><h3>手動調整分袋</h3><p class="muted">可將單一便當品項的指定份數移至其他袋號，儲存後公告會使用調整結果。飲料跟隨同單位便當，不另分袋。</p><div class="grid"><div class="field"><label>要移動的便當</label><select id="cloudMoveSource">${moveOptions.map((e,i)=>`<option value="${i}">${esc(e.unit)}｜${esc(cloudMealLabel(units.get(e.unit).get(e.key)))} × ${e.qty}（第 ${e.bag} 袋）</option>`).join('')}</select></div><div class="field"><label>移動份數</label><input id="cloudMoveQty" type="number" min="1" value="1" step="1"></div><div class="field"><label>移至袋號</label><input id="cloudMoveTarget" type="number" min="1" value="3" step="1"></div></div><div class="row"><button id="cloudMoveSave">儲存分袋調整</button><button id="cloudResetBags" class="ghost">恢復自動分袋</button></div></div>`:'';
  $('cloudOrdersAdmin').innerHTML=`<div class="card"><h2>本輪訂單管理</h2><div class="notice">目前輪次：${esc(rid)}。訂餐期間僅顯示即時統計；截止後由管理者產生並確認分袋，分袋結果會儲存。</div><div class="grid three"><div class="kpi">訂購單位<b>${units.size}</b></div><div class="kpi">便當<b>${bento}</b></div><div class="kpi">飲料<b>${drinks}</b></div></div><p><b>合計 NT$ ${amount}</b></p><div class="row"><button id="cloudRefreshOrders" class="ghost">重新整理訂單</button><button id="cloudCloseOrders" ${isClosed?'disabled':''}>提前截止訂餐</button><button id="cloudStartRound" class="ghost">開始新一輪（舊單保留）</button><button id="cloudClearHistory" class="danger">清空歷史訂單（永久刪除）</button></div><h3 style="margin-top:20px">各單位訂單</h3>${unitHtml}<h3>店家訂購總表</h3>${storeHtml}<div class="card" style="margin-top:18px"><h3>截止後分袋</h3>${!isClosed?'<p class="muted">訂餐尚未截止，分袋功能將在截止後開放。</p>':`<p class="muted">${plan?'已產生分袋結果，可手動調整。':'尚未產生分袋結果，請按下方按鈕。'} 只有飲料的單位不分袋。</p><button id="cloudGenerateBags">${plan?'重新自動分袋（覆蓋手動調整）':'產生自動分袋'}</button>${plan?bagHtml+moveHtml:''}`}</div><div class="card" style="margin-top:18px"><h3>訂餐結算公告</h3><p class="muted">${!isClosed?'訂餐截止後才能產生公告。':!plan?'請先產生分袋結果，才能產生結算公告。':'依已儲存的最終分袋結果計算，只有飲料的單位不顯示袋號。'}</p><textarea id="cloudNoticeText" rows="8" readonly style="min-height:170px" placeholder="截止並分袋後產生結算公告"></textarea><div class="row"><button id="cloudGenerateNotice" ${isClosed&&plan?'':'disabled'}>產生結算訊息</button><button id="cloudCopyNotice" class="ghost" disabled>複製訊息</button></div></div><div class="card" style="margin-top:18px"><h3>各單位訂餐明細</h3><p class="muted">依本輪有效訂單彙整餐點與數量，含飲料甜度及冰量；與結算公告分開複製。</p><textarea id="cloudDetailText" rows="10" readonly style="min-height:210px" placeholder="產生各單位訂餐明細"></textarea><div class="row"><button id="cloudGenerateDetail" ${isClosed?'':'disabled'}>產生明細訊息</button><button id="cloudCopyDetail" class="ghost" disabled>複製明細</button></div></div><p class="muted">歷史訂單：${past.length} 筆；沒有本輪 roundId 的測試文件不會混入統計。</p></div>${historyPanel(past,session)}`;
  $('cloudRefreshOrders').onclick=renderCloudAdminOrders;
  $('cloudCloseOrders').onclick=async()=>{if(!confirm('確定提前截止本輪訂餐？截止後使用者不能追加或取消。'))return;try{await updateDoc(doc(db,'sessions','current'),{orderingOpen:false});await renderCloudAdminOrders()}catch(e){err(e)}};
  if(isClosed){
   $('cloudGenerateBags').onclick=async()=>{if(plan&&!confirm('確定重新自動分袋？目前手動調整的袋號將被覆蓋。'))return;try{await updateDoc(doc(db,'sessions','current'),{bagPlan:makeCloudBagPlan(units,session,rid)});await renderCloudAdminOrders()}catch(e){err(e)}};
   if(plan){
    if($('cloudMoveSave'))$('cloudMoveSave').onclick=async()=>{
     const source=moveOptions[Number($('cloudMoveSource').value)],qty=Number($('cloudMoveQty').value),target=Number($('cloudMoveTarget').value);
     if(!source||!Number.isSafeInteger(qty)||qty<1||qty>source.qty||!Number.isSafeInteger(target)||target<1||target>999||target===source.bag)return alert('請確認移動份數及目標袋號（須不同於原袋號）');
     const entries=plan.entries.map(e=>({...e}));const old=entries.find(e=>e.unit===source.unit&&e.key===source.key&&e.bag===source.bag);
     if(!old||old.qty<qty)return alert('目前袋內數量不足');old.qty-=qty;
     let dest=entries.find(e=>e.unit===source.unit&&e.key===source.key&&e.bag===target);
     if(dest)dest.qty+=qty;else entries.push({unit:source.unit,key:source.key,bag:target,qty});
     try{await updateDoc(doc(db,'sessions','current'),{bagPlan:{...plan,entries:entries.filter(e=>e.qty>0)}});await renderCloudAdminOrders()}catch(e){err(e)}
    };
    if($('cloudResetBags'))$('cloudResetBags').onclick=async()=>{if(!confirm('確定恢復自動分袋？'))return;try{await updateDoc(doc(db,'sessions','current'),{bagPlan:makeCloudBagPlan(units,session,rid)});await renderCloudAdminOrders()}catch(e){err(e)}};
   }
  }
  $('cloudGenerateDetail').onclick=()=>{$('cloudDetailText').value=detailText;$('cloudCopyDetail').disabled=false};
  $('cloudCopyDetail').onclick=async()=>{try{await navigator.clipboard.writeText($('cloudDetailText').value);alert('已複製訂餐明細')}catch(e){$('cloudDetailText').select();alert('無法自動複製，請手動複製選取文字')}};
  $('cloudGenerateNotice').onclick=()=>{$('cloudNoticeText').value=noticeText;$('cloudCopyNotice').disabled=false};
  $('cloudCopyNotice').onclick=async()=>{try{await navigator.clipboard.writeText($('cloudNoticeText').value);alert('已複製結算訊息')}catch(e){$('cloudNoticeText').select();alert('無法自動複製，請手動複製選取文字')}};
  $('cloudStartRound').onclick=async()=>{if(!confirm('確定結束目前輪次並開始新一輪？舊訂單會保留，新一輪預設關閉訂餐。'))return;try{await updateDoc(doc(db,'sessions','current'),{roundId:'round_'+Date.now().toString(36),orderingOpen:false,finalized:false,bagPlan:null,roundHistory:[...(Array.isArray(session.roundHistory)?session.roundHistory:[]).filter(r=>r.id!==rid),{id:rid,endedAt:Date.now()}]});await renderCloudAdminOrders();alert('新一輪已建立。請設定新的截止時間並手動開放訂餐。')}catch(e){err(e)}};
  $('cloudClearHistory').onclick=async()=>{if(!past.length)return alert('沒有歷史訂單');if(prompt('要永久刪除 '+past.length+' 筆歷史訂單，請輸入「刪除歷史」')!=='刪除歷史')return;try{for(let i=0;i<past.length;i+=400){const batch=writeBatch(db);past.slice(i,i+400).forEach(x=>batch.delete(doc(db,'orders',x.id)));await batch.commit()}await updateDoc(doc(db,'sessions','current'),{roundHistory:[]});await renderCloudAdminOrders();alert('歷史訂單已刪除')}catch(e){err(e)}};
 }catch(e){err(e)}
}


$('login').classList.add('hidden');$('logout').classList.add('hidden');$('identity').textContent='正在確認登入狀態…';
// Wait for Firebase to restore a persisted Google session before considering anonymous sign-in.
auth.authStateReady().then(()=>{if(mainTab==='user')return v17InitUser()}).catch(cuError);
</script></body></html>
